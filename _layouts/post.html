---
# Front matter comment to ensure Jekyll properly reads file.
---
<!DOCTYPE html>
<html lang="en-us">
{% include head.html %}
<body class="subPageBody">
  <div class="headerBackground subPageHeaderBackground">
    <div class="container subPageContainer">
      {% include header.html %}
      <article class="post-article page markdown-body">
        <nav class="breadcrumbs">
          <a href="{{ '/' | relative_url }}" target="_self">Home</a> ›
          <a href="{{ '/blog' | relative_url }}" target="_self">Blog</a> ›
          <span>{{ page.title }}</span>
        </nav>

        <header class="post-header">
          <h1>{{ page.title }}</h1>
          <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
        </header>

        {{ content }}
      </article>
    </div>
    {% include appstoreimages.html %}
  </div>
</body>
</html>
