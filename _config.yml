# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Interior Design
    description                           : Reimagine any room with AI-powered design ideas. Upload a photo and get stunning redesign options instantly.
    fontawesome_icon_name                 : couch

  - title                                 : Magic Brush
    description                           : Paint over any item to swap it with furniture, plants, or décor. Change a single piece or transform the whole room.
    fontawesome_icon_name                 : wand-magic-sparkles

  - title                                 : Exterior Design
    description                           : Try new colors, facades, or architectural features on your house — without lifting a paintbrush.
    fontawesome_icon_name                 : house-chimney

  - title                                 : Landscape Design
    description                           : Design beautiful gardens, patios, and walkways with the help of AI. See your outdoor space transformed.
    fontawesome_icon_name                 : seedling

  - title                                 : Staging
    description                           : Turn vacant rooms into styled, furnished spaces instantly. Perfect for real estate listings and interior planning.
    fontawesome_icon_name                 : layer-group

  - title                                 : Before & After
    description                           : Compare your original space side-by-side with the AI redesign using a swipe slider. Save and share your favourites.
    fontawesome_icon_name                 : sliders



